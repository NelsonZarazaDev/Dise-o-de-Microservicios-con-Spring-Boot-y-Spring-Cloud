spring:
  profiles:
    active: qa
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/NelsonZarazaDev/microservice-configs.git
          default-label: main
          clone-on-start: true
          username: NelsonZarazaDev
          password: ${GIT_TOKEN}
server:
  port: 7777

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.value}"
  client:
    service-url:
      defaultZone: "${EUREKA_URL}"