spring:
  application:
    name: gateway
  profiles:
    default: oauth2
server:
  port: 4040
# No se usa instancia ya que no tiene sentido registrarlo en ureka
# Solo se usa client para que funcione el balanceo de cargas
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    fetch-registry: true
